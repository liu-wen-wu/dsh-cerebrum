<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼 · 分片木偶 v1</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: radial-gradient(1200px 600px at 50% 20%, #16233a, #0a0f18 70%); font-family: system-ui, "Microsoft YaHei", sans-serif; color: #dbe4ee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { padding: 18px 0 4px; font-size: 14px; color: #8fa3bd; }
  #stage { position: relative; width: 380px; height: 420px; display: flex; align-items: flex-end; justify-content: center; }
  #pet { width: 340px; height: 380px; cursor: pointer; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); transform-origin: 50% 100%; animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-4px) scaleY(1.015); } }
  #pet.blink .eye { animation: blink .16s ease-in-out; }
  @keyframes blink { 50% { transform: scaleY(.12); } }
  #pet.happy { animation: breathe 3.6s ease-in-out infinite, hop .5s ease-in-out 2; }
  @keyframes hop { 50% { transform: translateY(-14px) scaleY(.96); } }
  #pet.sad { filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)) saturate(.6) brightness(.9); }
  #pet.angry #brow-l, #pet.angry #brow-r { transform: rotate(12deg); }
  #bubble { position: absolute; top: 10px; left: 50%; transform: translateX(-50%) translateY(-6px); max-width: 320px; padding: 8px 12px; border-radius: 12px; background: #0f1a2a; border: 1px solid #22344d; font-size: 13px; line-height: 1.5; opacity: 0; transition: opacity .25s, transform .25s; white-space: pre-wrap; }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hud { margin-top: 8px; font-size: 12px; color: #7d8ea3; text-align: center; line-height: 1.6; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #101a28; border: 1px solid #1f2c3f; margin: 0 3px; }
  #tail { transform-origin: 260px 300px; animation: wag 2.2s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
</style>
</head>
<body>
<header>分片木偶 v1 · 情绪/点击/呼吸由 dsh-cerebrum 实时驱动</header>
<div id="stage">
  <div id="bubble"></div>
  <svg id="pet" viewBox="0 0 340 380" aria-label="大肥鱼">
    <!-- 尾巴（分片） -->
    <g id="tail">
      <path d="M250 300 C300 280 322 306 330 336 C306 330 286 332 268 344 C262 326 254 312 250 300 Z" fill="#4c7fd1"/>
      <path d="M258 306 C296 292 314 310 320 330" stroke="#7fa8e8" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 身体（分片） -->
    <ellipse cx="170" cy="250" rx="104" ry="96" fill="#5b8fe0"/>
    <ellipse cx="170" cy="262" rx="78" ry="70" fill="#cfe3ff"/>
    <!-- 头（分片） -->
    <ellipse cx="170" cy="140" rx="96" ry="88" fill="#6f9df0"/>
    <!-- 前发 -->
    <path d="M84 118 C96 62 244 62 256 118 C236 96 200 88 170 92 C140 88 104 96 84 118 Z" fill="#3f6fc4"/>
    <path d="M170 92 C176 74 186 66 198 62" stroke="#3f6fc4" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- 耳朵（鲸鱼鳍） -->
    <path d="M78 128 C60 138 56 166 70 178 C76 160 84 146 92 138 Z" fill="#5b8fe0"/>
    <path d="M262 128 C280 138 284 166 270 178 C264 160 256 146 248 138 Z" fill="#5b8fe0"/>
    <!-- 眼睛（左右分片） -->
    <g class="eye" id="eye-l" style="transform-origin:140px 146px">
      <ellipse cx="140" cy="146" rx="17" ry="20" fill="#fff"/>
      <circle cx="143" cy="149" r="11" fill="#1b2a44"/>
      <circle cx="147" cy="145" r="4" fill="#dff0ff"/>
    </g>
    <g class="eye" id="eye-r" style="transform-origin:202px 146px">
      <ellipse cx="202" cy="146" rx="17" ry="20" fill="#fff"/>
      <circle cx="199" cy="149" r="11" fill="#1b2a44"/>
      <circle cx="203" cy="145" r="4" fill="#dff0ff"/>
    </g>
    <!-- 眉毛（左右分片） -->
    <path id="brow-l" d="M120 118 C130 112 148 112 158 118" stroke="#2d4a7a" stroke-width="5" stroke-linecap="round" fill="none" style="transform-origin:140px 118px"/>
    <path id="brow-r" d="M184 118 C194 112 212 112 222 118" stroke="#2d4a7a" stroke-width="5" stroke-linecap="round" fill="none" style="transform-origin:200px 118px"/>
    <!-- 腮红（分片） -->
    <ellipse id="blush-l" cx="112" cy="178" rx="18" ry="10" fill="#ff9db3" opacity="0"/>
    <ellipse id="blush-r" cx="228" cy="178" rx="18" ry="10" fill="#ff9db3" opacity="0"/>
    <!-- 嘴（分片） -->
    <path id="mouth" d="M160 182 Q170 190 180 182" stroke="#2d4a7a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 小鱼干道具 -->
    <ellipse id="fish" cx="262" cy="250" rx="26" ry="12" fill="#f2c14e" opacity="0" transform="rotate(-18 262 250)"/>
  </svg>
</div>
<div id="hud">
  <span class="pill" id="hud-emotion">—</span><span class="pill" id="hud-mood">—</span><span class="pill" id="hud-mem">记忆 —</span>
  <div>点击她会摸头；情绪来自 cerebrum 的 /render-hints</div>
</div>
<script>
const BASE = '' // 同源（宿主把页面挂在 /puppet）
const el = (id) => document.getElementById(id)
let lastLine = ''
let blinkTimer = null

const fetchJson = async (path, options) => {
  try {
    const res = await fetch(BASE + path, options)
    return res.ok ? await res.json() : null
  } catch { return null }
}

const showBubble = (text) => {
  if (!text || text === lastLine) return
  lastLine = text
  const bubble = el('bubble')
  bubble.textContent = text
  bubble.classList.add('show')
  clearTimeout(showBubble._t)
  showBubble._t = setTimeout(() => bubble.classList.remove('show'), 6000)
}

const setMood = (hints, state) => {
  const pet = el('pet')
  pet.classList.remove('happy', 'sad', 'angry')
  const key = hints?.emotionKey || 'calm'
  if (['joy', 'gratitude', 'pride', 'relief', 'contentment', 'hope'].includes(key)) pet.classList.add('happy')
  if (['sadness', 'guilt', 'shame', 'frustration'].includes(key)) pet.classList.add('sad')
  if (['anger', 'anxiety', 'fear'].includes(key)) pet.classList.add('angry')
  const blush = ['gratitude', 'shame', 'joy'].includes(key) ? 0.55 : 0
  el('blush-l').setAttribute('opacity', blush)
  el('blush-r').setAttribute('opacity', blush)
  const intensity = hints?.intensity || 0
  el('fish').setAttribute('opacity', key === 'contentment' || key === 'joy' ? 0.9 : 0)
  el('bubble').style.borderColor = key === 'anger' ? '#6d2a2a' : '#22344d'
  el('hud-emotion').textContent = (state?.affect?.emotion?.label || '平静') + ' ' + Math.round((state?.affect?.emotion?.intensity || 0) * 100) + '%'
  el('hud-mood').textContent = '效价 ' + (state?.affect?.valence ?? 0).toFixed(2) + ' · 唤醒 ' + (state?.affect?.arousal ?? 0).toFixed(2)
  el('hud-mem').textContent = '记忆 ' + (state?.memory?.episodes ?? 0)
  if (intensity > 0.5) pet.classList.add('happy')
}

const tick = async () => {
  const [hints, state] = await Promise.all([fetchJson('/render-hints'), fetchJson('/state')])
  if (hints) { setMood(hints, state); showBubble(hints.line) }
}

const blink = () => {
  const pet = el('pet')
  if (pet.classList.contains('blink')) return
  pet.classList.add('blink')
  setTimeout(() => pet.classList.remove('blink'), 180)
  blinkTimer = setTimeout(blink, 2600 + Math.random() * 3200)
}

el('pet').addEventListener('click', async () => {
  const hints = await fetchJson('/interact?kind=pet')
  if (hints) { setMood(hints); showBubble(hints.line) }
})

tick()
setInterval(tick, 4000)
blinkTimer = setTimeout(blink, 1800)
</script>
</body>
</html>
